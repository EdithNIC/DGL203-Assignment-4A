<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap-CDN</title>
    <!-- link to Bootstrap files via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!-- link to Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand text-uppercase" href="#">AuroraTours</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#">Packages</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">FAQ</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- link to BootStrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
  <main>
    <div class="modal fade" tabindex="-1" id="booking-modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Book a guide</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form action="#">
              <div class="row g-2">
                <div class="col-6">
                  <div class="form-floating">
                    <input
                      id="email1"
                      type="email1"
                      class="form-control"
                      placeholder="Your email"
                    />
                    <label for="email">Email address</label>
                  </div>
                </div>
                <div class="col-6">
                  <div class="form-floating">
                    <select id="select1" class="form-select">
                      <option>
                        Mount Abert Edwards | altitude: 2,093 m | distance: 32
                        km| duration: 2 days / 1 nights | price per person: $200
                        CAD
                      </option>
                      <option>
                        Mout Myra | altitude: 1,803 m | distance: 14 km |
                        duration: 3 days / 2 nights | price per person: $255 CAD
                      </option>
                      <option>
                        Kings Peak | altitude: 2,065 m | distance: 14.5 km |
                        duration: 2 days / 2 nights | price per person: $325 CAD
                      </option>
                    </select>
                    <label for="select1">Choose a Hike</label>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-primary">Checkout</button>
          </div>
        </div>
      </div>
    </div>
    <div id="hero-carousel" class="carousel slide">
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="##hero-carousel"
          data-bs-slide-to="0"
          class="active"
          aria-current="true"
          aria-label="Slide 1"
        ></button>
        <button
          type="button"
          data-bs-target="##hero-carousel"
          data-bs-slide-to="1"
          aria-label="Slide 2"
        ></button>
        <button
          type="button"
          data-bs-target="##hero-carousel"
          data-bs-slide-to="2"
          aria-label="Slide 3"
        ></button>
      </div>
      <div class="modal fade" tabindex="-1" id="booking-modal-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Book a tour</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form action="#">
                <div class="form-floating">
                  <input
                    id="email2"
                    type="email"
                    class="form-control"
                    placeholder="Your email"
                  />
                  <label for="email2">Email address</label>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="button" class="btn btn-primary">Checkout</button>
            </div>
          </div>
        </div>
      </div>
      <div class="carousel-inner">
        <div class="carousel-item active c-item">
          <img
            src="images/exploring-strathcona.png"
            class="d-block w-100 c-img"
            alt="Hiker overlooking the mountains of Strathcona Provincial Park"
          />
          <div class="carousel-caption top-0 mt-4 d-none d-md-block">
            <p class="fs-3 text-uppercase mt-5">Adventure starts here</p>
            <h1 class="display-1 fw-bolder text-capitalize">
              Hike Strathcona Park
            </h1>
            <button
              type="button"
              class="btn btn-primary px-4 py-2 fs-5 mt-5"
              data-bs-toggle="modal"
              data-bs-target="#booking-modal"
            >
              Book a guide
            </button>
          </div>
        </div>
        <div class="carousel-item c-item">
          <img
            src="images/Road_Trip_By_Car.jpg"
            class="d-block w-100 c-img"
            alt="Scenic road trip through a mountain landscape"
          />
          <div class="carousel-caption top-0 mt-4 d-none d-md-block">
            <p class="fs-3 text-uppercase mt-5">Discover the great outdoors</p>
            <h1 class="display-1 fw-bolder text-capitalize">
              Explore Wild Waters
            </h1>
            <button
              type="button"
              class="btn btn-primary px-4 py-2 fs-5 mt-5"
              data-bs-toggle="modal"
              data-bs-target="#booking-modal"
            >
              Book an adventure
            </button>
          </div>
        </div>
        <div class="modal fade" tabindex="-1" id="booking-modal-3">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Book accomodations</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <form action="#">
                  <div class="form-floating">
                    <input
                      id="email3"
                      type="email"
                      class="form-control"
                      placeholder="Your email"
                    />
                    <label for="email3">Email address</label>
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Close
                </button>
                <button type="button" class="btn btn-primary">Checkout</button>
              </div>
            </div>
          </div>
        </div>
        <div class="carousel-item c-item">
          <img
            src="images/holberg rd.png"
            class="d-block w-100 c-img"
            alt="Scenic road through the wilderness near Vancouver Island North"
          />
          <div class="carousel-caption top-0 mt-4 d-none d-md-block">
            <p class="fs-3 text-uppercase mt-5">Take the road less traveled</p>
            <h1 class="display-1 fw-bolder text-capitalize">
              North Vancouver Island
            </h1>
            <button
              type="button"
              class="btn btn-primary px-4 py-2 fs-5 mt-5"
              data-bs-toggle="modal"
              data-bs-target="#booking-modal"
            >
              Explore destinations
            </button>
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#hero-carousel"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#hero-carousel"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>
  </main>
</html>
